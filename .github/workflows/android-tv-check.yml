name: Android TV verification

on:
  pull_request:
    paths:
      - "android-tv/**"
      - ".github/workflows/android-tv-check.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android build packages
        run: $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Compile and test the TV wrapper
        run: gradle -p android-tv testDebugUnitTest assembleDebug --no-daemon
      - uses: actions/upload-artifact@v7
        with:
          name: jl-tv-debug-verification
          path: android-tv/app/build/outputs/apk/debug/*.apk
          retention-days: 7
