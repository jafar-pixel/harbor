name: Android TV verification

on:
  pull_request:
    paths:
      - "android-tv/**"
      - "src/views/big-picture/**"
      - "src/views/player.tsx"
      - "src/lib/player/**"
      - "tests/sports-playback.test.ts"
      - ".github/workflows/android-tv-check.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify Pro navigation and playback
        run: node --experimental-loader ./scripts/node-test-loader.mjs --test tests/big-picture.test.ts tests/sports-playback.test.ts tests/native-tv-under-page.test.ts tests/jl-account-lifecycle.test.ts
      - name: Bundle the frontend under review into the APK
        env:
          VITE_JL_SUPABASE_URL: ${{ vars.JL_SUPABASE_URL }}
          VITE_JL_SUPABASE_ANON_KEY: ${{ vars.JL_SUPABASE_ANON_KEY }}
        run: |
          pnpm run build
          python3 android-tv/tools/bundle_site.py dist android-tv/app/src/main/assets/site
          test -s android-tv/app/src/main/assets/site/index.html
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android build packages
        run: $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Compile and test the TV wrapper
        run: gradle -p android-tv testDebugUnitTest assembleDebug --no-daemon
      - name: Verify the Pro build installs beside older builds
        shell: bash
        run: |
          apk=android-tv/app/build/outputs/apk/debug/app-debug.apk
          badging=$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk")
          package_id="com.jlstream.mediavision.proverify.b${GITHUB_RUN_NUMBER}a${GITHUB_RUN_ATTEMPT}"
          [[ "$badging" == *"package: name='$package_id'"* ]]
          [[ "$badging" == *"application-label:'JL Pro Verification ${GITHUB_RUN_NUMBER}'"* ]]
      - uses: actions/upload-artifact@v7
        with:
          name: jl-tv-debug-verification
          path: android-tv/app/build/outputs/apk/debug/*.apk
          retention-days: 7
