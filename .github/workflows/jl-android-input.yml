name: JL Android input check
on:
  pull_request:
    branches: ["claude/determined-planck-b1p158"]
    paths: ["android-tv/**", ".github/workflows/jl-android-input.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    name: Compile Android remote input
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;34.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Compile APK
        run: gradle -p android-tv assembleDebug --no-daemon
