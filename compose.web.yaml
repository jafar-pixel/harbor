# The JL Media Vision website (watch.jl-stream.com, mediavision.jl-stream.com) on this server.
# Listens only on this machine (127.0.0.1:3103); Cloudflare Tunnel brings the public addresses
# to it. Separate from the dev server (3102) and from anything else on this machine.
#
#   docker compose -f compose.web.yaml up -d --build
services:
  jl-mediavision-web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: jl-mediavision-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:3103:3000"
    env_file:
      # VITE_JL_SUPABASE_URL and VITE_JL_SUPABASE_ANON_KEY (to check who is signed in).
      - .env.local
      # PLAYBACK_RELAY_KEY, PLAYBACK_RELAY_BASE=/secure, PLAYBACK_RELAY_USERS (never committed).
      - .env.server
    environment:
      # Smart Lists (server/smart-list.ts): the lists file lives in ./smart-lists on this machine
      # and is never committed; the trimmed lists are kept in their own volume.
      JL_SMART_LISTS: /config/smart-lists.json
      JL_SMART_DATA: /data/smart
    volumes:
      - ./smart-lists:/config:ro
      - jl-smart-data:/data/smart

volumes:
  jl-smart-data:
